services:
  db:
    image: postgres:16-alpine
    container_name: bibliotheque-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: bibliotheque
      POSTGRES_PASSWORD: dev_local_password
      POSTGRES_DB: bibliotheque
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bibliotheque_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibliotheque -d bibliotheque"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  bibliotheque_postgres_dev:
